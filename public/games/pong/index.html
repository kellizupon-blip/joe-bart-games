<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 540px;
      max-width: 95vw;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .p1 { color: #38bdf8; }
    .p2 { color: #ec4899; }
    canvas {
      background: #030712;
      border: 1px solid #1e293b;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.08);
      width: 540px;
      height: 360px;
      max-width: 95vw;
      max-height: 65vh;
    }
    .overlay {
      position: absolute;
      top: 36px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      z-index: 10;
    }
    .overlay h2 {
      font-size: 26px;
      color: #f8fafc;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .overlay p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
      max-width: 320px;
    }
    .mode-select {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #0369a1; }
    .btn.secondary {
      background: #1e293b;
      color: #cbd5e1;
    }
    .btn.secondary:hover { background: #334155; }
    .controls-hint {
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div class="p1">PLAYER 1: <span id="score-p1">0</span></div>
      <div class="p2" id="p2-label">CPU BOT: <span id="score-p2">0</span></div>
    </div>
    <canvas id="gameCanvas" width="540" height="360"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="overlay-title">CYBER PONG</h2>
      <p id="overlay-desc">Select Game Mode to start. First to 5 points wins!</p>
      <div class="mode-select">
        <button class="btn" id="btn-1p">1 PLAYER (VS BOT)</button>
        <button class="btn secondary" id="btn-2p">2 PLAYERS (LOCAL)</button>
      </div>
    </div>

    <div class="controls-hint">P1: W/S or Mouse/Touch · P2: Up/Down Arrow Keys</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreP1El = document.getElementById('score-p1');
    const scoreP2El = document.getElementById('score-p2');
    const p2LabelEl = document.getElementById('p2-label');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const btn1P = document.getElementById('btn-1p');
    const btn2P = document.getElementById('btn-2p');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration = 0.06) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const paddleWidth = 10;
    const paddleHeight = 70;
    let p1 = { x: 16, y: 145, vy: 0 };
    let p2 = { x: canvas.width - 26, y: 145, vy: 0 };
    let ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 4, vy: 2, radius: 6 };

    let scoreP1 = 0;
    let scoreP2 = 0;
    const winningScore = 5;
    let isVsBot = true;
    let isRunning = false;
    let animId = null;

    const keys = {};

    function startMatch(vsBot) {
      isVsBot = vsBot;
      p2LabelEl.innerHTML = (isVsBot ? 'CPU BOT' : 'PLAYER 2') + ': <span id="score-p2">0</span>';
      scoreP1 = 0;
      scoreP2 = 0;
      scoreP1El.innerText = 0;
      document.getElementById('score-p2').innerText = 0;
      resetBall(1);
      isRunning = true;
      overlay.style.display = 'none';
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * Math.PI / 4) - (Math.PI / 8);
      const speed = 4.5;
      ball.vx = direction * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function loop() {
      if (!isRunning) return;

      // P1 movement
      if (keys['w'] || keys['W']) p1.y -= 5.5;
      if (keys['s'] || keys['S']) p1.y += 5.5;

      // P2 movement
      if (isVsBot) {
        const targetY = ball.y - paddleHeight / 2;
        const diff = targetY - p2.y;
        p2.y += diff * 0.085; // smooth bot tracking
      } else {
        if (keys['ArrowUp']) p2.y -= 5.5;
        if (keys['ArrowDown']) p2.y += 5.5;
      }

      // Constrain paddles
      p1.y = Math.max(0, Math.min(canvas.height - paddleHeight, p1.y));
      p2.y = Math.max(0, Math.min(canvas.height - paddleHeight, p2.y));

      // Move ball
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top/bottom bounce
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy = -ball.vy;
        playBeep(330);
      } else if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy = -ball.vy;
        playBeep(330);
      }

      // Left paddle hit
      if (
        ball.x - ball.radius <= p1.x + paddleWidth &&
        ball.x + ball.radius >= p1.x &&
        ball.y >= p1.y &&
        ball.y <= p1.y + paddleHeight
      ) {
        ball.x = p1.x + paddleWidth + ball.radius;
        const impact = (ball.y - (p1.y + paddleHeight / 2)) / (paddleHeight / 2);
        ball.vx = Math.abs(ball.vx) * 1.05;
        ball.vy = impact * 5.5;
        playBeep(520);
      }

      // Right paddle hit
      if (
        ball.x + ball.radius >= p2.x &&
        ball.x - ball.radius <= p2.x + paddleWidth &&
        ball.y >= p2.y &&
        ball.y <= p2.y + paddleHeight
      ) {
        ball.x = p2.x - ball.radius;
        const impact = (ball.y - (p2.y + paddleHeight / 2)) / (paddleHeight / 2);
        ball.vx = -Math.abs(ball.vx) * 1.05;
        ball.vy = impact * 5.5;
        playBeep(480);
      }

      // Score check
      if (ball.x < 0) {
        scoreP2++;
        document.getElementById('score-p2').innerText = scoreP2;
        playBeep(220, 0.2);
        if (scoreP2 >= winningScore) return matchOver(isVsBot ? 'CPU BOT' : 'PLAYER 2');
        resetBall(1);
      } else if (ball.x > canvas.width) {
        scoreP1++;
        scoreP1El.innerText = scoreP1;
        playBeep(660, 0.2);
        if (scoreP1 >= winningScore) return matchOver('PLAYER 1');
        resetBall(-1);
      }

      draw();
      animId = requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center divider line
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // P1 Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 8;
      ctx.fillRect(p1.x, p1.y, paddleWidth, paddleHeight);

      // P2 Paddle
      ctx.fillStyle = '#ec4899';
      ctx.shadowColor = '#ec4899';
      ctx.fillRect(p2.x, p2.y, paddleWidth, paddleHeight);

      // Ball
      ctx.fillStyle = '#f8fafc';
      ctx.shadowColor = '#f8fafc';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function matchOver(winner) {
      isRunning = false;
      overlayTitle.innerText = `${winner} WINS!`;
      overlayDesc.innerText = `Final Score: ${scoreP1} - ${scoreP2}`;
      overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // Mouse / Touch tracking for P1
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = ((e.clientY - rect.top) / rect.height) * canvas.height;
      p1.y = mouseY - paddleHeight / 2;
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touchY = ((e.touches[0].clientY - rect.top) / rect.height) * canvas.height;
      p1.y = touchY - paddleHeight / 2;
    }, { passive: false });

    btn1P.addEventListener('click', () => startMatch(true));
    btn2P.addEventListener('click', () => startMatch(false));

    draw();
  </script>
</body>
</html>
