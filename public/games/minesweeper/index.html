<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classic Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    #game-container {
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .top-controls {
      display: flex;
      gap: 8px;
    }
    .diff-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .diff-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #030712;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 6px 14px;
      width: 100%;
    }
    .digital-lcd {
      background: #090d16;
      color: #ef4444;
      font-family: "Courier New", Courier, monospace;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #1f2937;
      min-width: 60px;
      text-align: center;
    }
    .face-btn {
      font-size: 20px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .face-btn:hover { background: #334155; }
    .board {
      display: grid;
      gap: 2px;
      background: #1e293b;
      padding: 4px;
      border-radius: 6px;
      max-width: 95vw;
      max-height: 65vh;
      overflow: auto;
    }
    .cell {
      width: 30px;
      height: 30px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .cell:hover:not(.revealed) { background: #475569; }
    .cell.revealed {
      background: #090d16;
      border-color: #1e293b;
      cursor: default;
    }
    .cell.mine { background: #ef4444; color: #fff; }
    .cell.flagged { color: #f59e0b; }
    .n-1 { color: #38bdf8; }
    .n-2 { color: #4ade80; }
    .n-3 { color: #f87171; }
    .n-4 { color: #a78bfa; }
    .n-5 { color: #fbbf24; }
    .n-6 { color: #2dd4bf; }
    .n-7 { color: #f472b6; }
    .n-8 { color: #cbd5e1; }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
      font-size: 12px;
      color: #64748b;
    }
    .flag-toggle-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .flag-toggle-btn.active {
      background: #f59e0b;
      color: #030712;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="top-controls">
      <button class="diff-btn active" data-diff="easy">EASY (9x9)</button>
      <button class="diff-btn" data-diff="medium">MEDIUM (16x16)</button>
    </div>

    <div class="header-bar">
      <div class="digital-lcd" id="mines-count">010</div>
      <button class="face-btn" id="face">🙂</button>
      <div class="digital-lcd" id="timer">000</div>
    </div>

    <div class="board" id="board"></div>

    <div class="bottom-bar">
      <span>Right-click or toggle:</span>
      <button class="flag-toggle-btn" id="flag-mode">🚩 FLAG MODE: OFF</button>
    </div>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const minesCountEl = document.getElementById('mines-count');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('face');
    const flagModeBtn = document.getElementById('flag-mode');
    const diffBtns = document.querySelectorAll('.diff-btn');

    let rows = 9;
    let cols = 9;
    let totalMines = 10;
    let board = [];
    let isGameOver = false;
    let firstClick = true;
    let timer = 0;
    let timerInterval = null;
    let flagMode = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function initGame() {
      isGameOver = false;
      firstClick = true;
      faceBtn.innerText = '🙂';
      clearInterval(timerInterval);
      timer = 0;
      timerEl.innerText = '000';
      minesCountEl.innerText = String(totalMines).padStart(3, '0');

      board = [];
      boardEl.innerHTML = '';
      boardEl.style.gridTemplateColumns = `repeat(${cols}, 30px)`;

      for (let r = 0; r < rows; r++) {
        board[r] = [];
        for (let c = 0; c < cols; c++) {
          const cell = {
            r, c,
            isMine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el: document.createElement('div')
          };
          cell.el.className = 'cell';
          cell.el.addEventListener('click', (e) => handleClick(r, c));
          cell.el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          boardEl.appendChild(cell.el);
          board[r][c] = cell;
        }
      }
    }

    function plantMines(firstR, firstC) {
      let planted = 0;
      while (planted < totalMines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        // Avoid first click and neighbors
        if (!board[r][c].isMine && (Math.abs(r - firstR) > 1 || Math.abs(c - firstC) > 1)) {
          board[r][c].isMine = true;
          planted++;
        }
      }

      // Calculate neighbor counts
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!board[r][c].isMine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].isMine) {
                  count++;
                }
              }
            }
            board[r][c].count = count;
          }
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timer++;
        timerEl.innerText = String(Math.min(999, timer)).padStart(3, '0');
      }, 1000);
    }

    function handleClick(r, c) {
      if (isGameOver) return;
      if (flagMode) return toggleFlag(r, c);

      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (firstClick) {
        firstClick = false;
        plantMines(r, c);
        startTimer();
      }

      if (cell.isMine) {
        gameOver(false);
      } else {
        reveal(r, c);
        checkWin();
      }
    }

    function reveal(r, c) {
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      cell.el.classList.add('revealed');
      playBeep(420);

      if (cell.count > 0) {
        cell.el.innerText = cell.count;
        cell.el.classList.add(`n-${cell.count}`);
      } else {
        // Flood fill empty cells
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
              reveal(nr, nc);
            }
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (isGameOver || firstClick) return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      if (cell.flagged) {
        cell.el.classList.add('flagged');
        cell.el.innerText = '🚩';
        playBeep(600);
      } else {
        cell.el.classList.remove('flagged');
        cell.el.innerText = '';
        playBeep(300);
      }

      // Update remaining flags count
      let flaggedCount = 0;
      board.forEach(row => row.forEach(c => { if (c.flagged) flaggedCount++; }));
      minesCountEl.innerText = String(Math.max(0, totalMines - flaggedCount)).padStart(3, '0');
    }

    function checkWin() {
      let unrevealedSafe = 0;
      board.forEach(row => row.forEach(c => {
        if (!c.isMine && !c.revealed) unrevealedSafe++;
      }));

      if (unrevealedSafe === 0) {
        gameOver(true);
      }
    }

    function gameOver(won) {
      isGameOver = true;
      clearInterval(timerInterval);
      faceBtn.innerText = won ? '😎' : '😵';

      // Reveal all mines
      board.forEach(row => row.forEach(c => {
        if (c.isMine) {
          c.el.classList.add('mine');
          c.el.innerText = '💣';
        }
      }));

      if (won) playBeep(880, 'triangle');
      else playBeep(140, 'sawtooth');
    }

    diffBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        diffBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const diff = btn.dataset.diff;
        if (diff === 'easy') {
          rows = 9; cols = 9; totalMines = 10;
        } else {
          rows = 16; cols = 16; totalMines = 40;
        }
        initGame();
      });
    });

    faceBtn.addEventListener('click', initGame);

    flagModeBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      flagModeBtn.classList.toggle('active', flagMode);
      flagModeBtn.innerText = flagMode ? '🚩 FLAG MODE: ON' : '🚩 FLAG MODE: OFF';
    });

    initGame();
  </script>
</body>
</html>
