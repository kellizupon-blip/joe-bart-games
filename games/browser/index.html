<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DuckDuckGo Private Browser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Browser Navigation Chrome */
    .browser-header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 50;
    }
    .browser-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #334155;
      color: #f1f5f9;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-btn:hover {
      background: #475569;
      border-color: #64748b;
    }
    .nav-btn:active {
      transform: scale(0.94);
    }

    /* Omnibar */
    .omnibar-container {
      flex: 1;
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1.5px solid #3b82f6;
      border-radius: 10px;
      padding: 0 10px;
      height: 38px;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .ddg-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
    }
    .omnibar-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 14px;
    }
    .omnibar-input::placeholder {
      color: #64748b;
    }
    .search-btn {
      background: #de5833;
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .search-btn:hover {
      background: #ea580c;
    }

    /* Action Buttons */
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .action-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #334155;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .action-btn:hover {
      background: #475569;
      color: #fff;
    }

    /* Bookmarks Bar */
    .bookmarks-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .bookmarks-bar::-webkit-scrollbar {
      height: 4px;
    }
    .bookmarks-bar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    .b-tag {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .b-tag:hover {
      color: #f8fafc;
      border-color: #38bdf8;
      background: #1e293b;
    }

    /* Content Area */
    .browser-viewport {
      flex: 1;
      position: relative;
      background: #0b101b;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    /* DuckDuckGo Start / Results Dashboard (shown when not viewing an iframe) */
    .ddg-dashboard {
      position: absolute;
      inset: 0;
      background: #0f172a;
      overflow-y: auto;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ddg-hero {
      text-align: center;
      margin-bottom: 28px;
    }
    .ddg-hero-logo {
      width: 72px;
      height: 72px;
      margin-bottom: 12px;
    }
    .ddg-hero h1 {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .ddg-hero p {
      font-size: 13px;
      color: #94a3b8;
      max-width: 480px;
      line-height: 1.5;
    }

    .results-container {
      width: 100%;
      max-width: 740px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .result-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px 20px;
      transition: border-color 0.15s;
    }
    .result-card:hover {
      border-color: #38bdf8;
    }
    .result-title {
      font-size: 17px;
      font-weight: 700;
      color: #38bdf8;
      text-decoration: none;
      display: block;
      margin-bottom: 4px;
      cursor: pointer;
    }
    .result-title:hover {
      text-decoration: underline;
    }
    .result-url {
      font-size: 11px;
      font-family: monospace;
      color: #10b981;
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-desc {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.45;
    }

    /* Privacy Banner */
    .privacy-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <!-- Top Browser Header Bar -->
  <header class="browser-header">
    <div class="browser-toolbar">
      <button id="btnBack" class="nav-btn" title="Back">←</button>
      <button id="btnForward" class="nav-btn" title="Forward">→</button>
      <button id="btnReload" class="nav-btn" title="Reload">↻</button>
      <button id="btnHome" class="nav-btn" title="DuckDuckGo Home">⌂</button>

      <!-- Omnibar -->
      <form id="searchForm" class="omnibar-container">
        <svg class="ddg-icon" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18" fill="#DE5833"/>
          <path d="M20 7C14.5 7 11 11 11 15C11 19.5 14.5 22 17 23C16 23.5 14 25 14 28C14 30.5 16 32 19 32C24 32 28 28.5 28 23C28 17.5 25.5 7 20 7Z" fill="white"/>
          <circle cx="17" cy="14" r="2" fill="#1E293B"/>
          <path d="M22 17C24 17 26 18.5 26 20C26 21.5 23.5 22 22 22C20.5 22 20 21 20 19.5C20 18 20.5 17 22 17Z" fill="#F59E0B"/>
        </svg>

        <input
          type="text"
          id="urlInput"
          class="omnibar-input"
          placeholder="Search with DuckDuckGo or enter URL (e.g. wikipedia.org)..."
          autocomplete="off"
        />

        <button type="submit" class="search-btn">Search</button>
      </form>

      <!-- Action buttons -->
      <div class="toolbar-actions">
        <button id="btnCloak" class="action-btn" title="Stealth Cloak (about:blank)">
          <span>🎭</span>
          <span>Cloak Tab</span>
        </button>
        <button id="btnFullscreen" class="action-btn" title="Toggle Fullscreen">
          <span>⛶</span>
        </button>
      </div>
    </div>

    <!-- Bookmarks Bar -->
    <div class="bookmarks-bar">
      <span style="font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase;">Quick Access:</span>
      <button class="b-tag" data-url="https://html.duckduckgo.com/html/">🦆 DuckDuckGo Home</button>
      <button class="b-tag" data-url="https://en.m.wikipedia.org">📚 Wikipedia</button>
      <button class="b-tag" data-url="https://www.desmos.com/calculator">📐 Desmos Math</button>
      <button class="b-tag" data-url="https://scratch.mit.edu/explore/projects/all">🐱 Scratch</button>
      <button class="b-tag" data-url="https://www.geogebra.org/calculator">📐 GeoGebra</button>
      <button class="b-tag" data-url="https://archive.org/web/">🏛️ Wayback Machine</button>
      <button class="b-tag" data-url="https://mathworld.wolfram.com">🧮 MathWorld</button>
    </div>
  </header>

  <!-- Browser Content Area -->
  <main class="browser-viewport">
    <!-- Webview Iframe -->
    <iframe
      id="webviewFrame"
      src=""
      allow="fullscreen; autoplay"
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock"
      referrerpolicy="no-referrer"
      style="display: none;"
    ></iframe>

    <!-- DuckDuckGo Dashboard & Search Results -->
    <div id="ddgDashboard" class="ddg-dashboard">
      <div class="ddg-hero">
        <svg class="ddg-hero-logo" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="19" fill="#DE5833"/>
          <path d="M20 7C14.5 7 11 11 11 15C11 19.5 14.5 22 17 23C16 23.5 14 25 14 28C14 30.5 16 32 19 32C24 32 28 28.5 28 23C28 17.5 25.5 7 20 7Z" fill="white"/>
          <circle cx="17" cy="14" r="2.2" fill="#1E293B"/>
          <path d="M22 17C24.5 17 26.5 18.5 26.5 20C26.5 21.5 23.5 22 22 22C20.5 22 20 21 20 19.5C20 18 20.5 17 22 17Z" fill="#F59E0B"/>
        </svg>
        <h1>DuckDuckGo Built-in Browser</h1>
        <p>
          Private, tracker-free search engineered for school Chromebooks. Zero history tracking, unblocked access, and instant results.
        </p>
        <div class="privacy-badge">
          <span>🔒 Linewize Shielded</span>
          <span>·</span>
          <span>Zero Logging</span>
          <span>·</span>
          <span>No Popups</span>
        </div>
      </div>

      <div id="resultsList" class="results-container">
        <!-- Results dynamically inserted here -->
      </div>
    </div>
  </main>

  <script>
    const frame = document.getElementById('webviewFrame');
    const dashboard = document.getElementById('ddgDashboard');
    const input = document.getElementById('urlInput');
    const resultsList = document.getElementById('resultsList');

    const historyStack = [];
    let historyIdx = -1;

    function navigate(url) {
      if (!url) return;

      if (!url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('./') && !url.startsWith('/')) {
        url = 'https://' + url;
      }

      historyStack.push(url);
      historyIdx = historyStack.length - 1;

      input.value = url;
      dashboard.style.display = 'none';
      frame.style.display = 'block';
      frame.src = url;
    }

    function showDashboard() {
      frame.style.display = 'none';
      frame.src = '';
      dashboard.style.display = 'flex';
      input.value = '';
    }

    // Instant DuckDuckGo API Search
    async function searchDuckDuckGo(query) {
      if (!query.trim()) return;

      input.value = query;
      frame.style.display = 'none';
      frame.src = '';
      dashboard.style.display = 'flex';

      resultsList.innerHTML = `
        <div style="text-align: center; padding: 40px; color: #94a3b8;">
          <div style="font-size: 28px; margin-bottom: 8px;">🔍</div>
          <div style="font-weight: 700;">Searching DuckDuckGo for "${query}"...</div>
        </div>
      `;

      try {
        // Query DuckDuckGo Instant Answers API
        const apiUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_redirect=1&no_html=1`;
        const res = await fetch(apiUrl);
        const data = await res.json();

        let html = '';

        // Instant Answer or Abstract
        if (data.AbstractText) {
          html += `
            <div class="result-card" style="border-left: 4px solid #38bdf8;">
              <div style="font-size: 11px; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: 4px;">⚡ Instant Answer</div>
              <div class="result-title" onclick="navigate('${data.AbstractURL || ''}')">${data.Heading || query}</div>
              <div class="result-url">${data.AbstractURL || 'duckduckgo.com'}</div>
              <div class="result-desc">${data.AbstractText}</div>
            </div>
          `;
        } else if (data.Answer) {
          html += `
            <div class="result-card" style="border-left: 4px solid #10b981;">
              <div style="font-size: 11px; font-weight: 800; color: #10b981; text-transform: uppercase; margin-bottom: 4px;">⚡ Direct Answer</div>
              <div style="font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 6px;">${data.Answer}</div>
            </div>
          `;
        }

        // Related Topics
        if (data.RelatedTopics && data.RelatedTopics.length > 0) {
          data.RelatedTopics.slice(0, 10).forEach(topic => {
            if (topic.Text && topic.FirstURL) {
              html += `
                <div class="result-card">
                  <div class="result-title" onclick="navigate('${topic.FirstURL}')">${topic.Text.split(' - ')[0] || topic.Text}</div>
                  <div class="result-url">${topic.FirstURL}</div>
                  <div class="result-desc">${topic.Text}</div>
                </div>
              `;
            } else if (topic.Topics) {
              topic.Topics.slice(0, 3).forEach(sub => {
                if (sub.Text && sub.FirstURL) {
                  html += `
                    <div class="result-card">
                      <div class="result-title" onclick="navigate('${sub.FirstURL}')">${sub.Text}</div>
                      <div class="result-url">${sub.FirstURL}</div>
                      <div class="result-desc">${sub.Text}</div>
                    </div>
                  `;
                }
              });
            }
          });
        }

        // Web Search Card
        const duckHtmlUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
        html += `
          <div class="result-card" style="background: #0f172a; border-style: dashed;">
            <div style="font-size: 12px; font-weight: 800; color: #f59e0b; margin-bottom: 6px;">🌐 Full Web Results</div>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 10px;">
              View all web pages, images, and articles matching your search on DuckDuckGo Lite.
            </p>
            <button onclick="navigate('${duckHtmlUrl}')" style="background: #de5833; border: none; color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer;">
              Open Full DuckDuckGo Search Page →
            </button>
          </div>
        `;

        resultsList.innerHTML = html;
      } catch (err) {
        // Fallback directly to DuckDuckGo HTML
        const duckHtmlUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
        navigate(duckHtmlUrl);
      }
    }

    // Form submit
    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = input.value.trim();
      if (!val) return;

      // If looks like a domain name or URL
      if (val.includes('.') && !val.includes(' ') && val.length > 3) {
        navigate(val);
      } else {
        searchDuckDuckGo(val);
      }
    });

    // Navigation buttons
    document.getElementById('btnBack').addEventListener('click', () => {
      if (historyIdx > 0) {
        historyIdx--;
        navigate(historyStack[historyIdx]);
      } else {
        showDashboard();
      }
    });

    document.getElementById('btnForward').addEventListener('click', () => {
      if (historyIdx < historyStack.length - 1) {
        historyIdx++;
        navigate(historyStack[historyIdx]);
      }
    });

    document.getElementById('btnReload').addEventListener('click', () => {
      if (frame.style.display !== 'none' && frame.src) {
        frame.src = frame.src;
      }
    });

    document.getElementById('btnHome').addEventListener('click', showDashboard);

    // Bookmarks
    document.querySelectorAll('.b-tag').forEach(b => {
      b.addEventListener('click', () => navigate(b.dataset.url));
    });

    // Stealth Cloak (Opens current page in about:blank)
    document.getElementById('btnCloak').addEventListener('click', () => {
      const win = window.open('about:blank', '_blank');
      if (!win) {
        alert('Please allow popups to open the stealth tab!');
        return;
      }
      const target = frame.style.display !== 'none' && frame.src ? frame.src : window.location.href;
      win.document.title = 'Google Docs';
      const link = win.document.createElement('link');
      link.rel = 'icon';
      link.href = 'https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico';
      win.document.head.appendChild(link);

      const ifr = win.document.createElement('iframe');
      ifr.src = target;
      ifr.style.width = '100vw';
      ifr.style.height = '100vh';
      ifr.style.border = 'none';
      ifr.style.margin = '0';
      ifr.style.padding = '0';
      win.document.body.style.margin = '0';
      win.document.body.style.overflow = 'hidden';
      win.document.body.appendChild(ifr);
    });

    // Fullscreen
    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Initial state: show popular search suggestions
    searchDuckDuckGo('unblocked games');
  </script>
</body>
</html>
